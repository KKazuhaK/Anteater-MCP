name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Syntax check
        run: node --check anteater-mcp.mjs

      - name: Version consistency
        run: npm run check:version

      - name: Configuration consistency
        run: node scripts/check-config.mjs

      - name: Tools load
        run: node anteater-mcp.mjs --list-tools

      - name: Offline conformance tests
        run: npm test

      - name: No runtime dependencies crept in
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
            if (p[field] && Object.keys(p[field]).length) {
              console.error(`unexpected runtime ${field}`);
              process.exit(1);
            }
          }
          console.log('zero runtime dependencies confirmed');
          NODE

      - name: OpenAPI specification is well formed
        run: |
          node - <<'NODE'
          const s = require('./gpt-actions-openapi.json');
          const ops = Object.values(s.paths).map((p) => p.get);
          if (!s.servers?.[0]?.url) throw new Error('missing servers');
          if (ops.length > 30) throw new Error('GPT Actions allows at most 30 operations');
          const ids = ops.map((o) => o.operationId);
          if (new Set(ids).size !== ids.length) throw new Error('duplicate operationId');
          for (const op of ops) {
            for (const parameter of op.parameters || []) {
              if (!parameter.schema?.type) {
                throw new Error(`parameter without schema: ${op.operationId}.${parameter.name}`);
              }
            }
          }
          if (JSON.stringify(s).includes('$ref')) throw new Error('dangling $ref');
          console.log(`${ops.length} operations, spec OK`);
          NODE

  sea-smoke:
    name: SEA packaging smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:sea -- --output dist/anteater-mcp
      - name: Exercise standalone binary
        run: |
          ./dist/anteater-mcp --version
          ./dist/anteater-mcp --list-tools | grep -q '^search_sections'
          ./dist/anteater-mcp --help | grep -q 'MCP over streamable HTTP'

  container-smoke:
    name: Container security and protocol smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg VCS_REF="${GITHUB_SHA}" -t anteater-mcp:ci .
      - name: Assert the labels the MCP registry requires
        # The registry reads io.modelcontextprotocol.server.name out of the image
        # config and rejects the package without it. That rejection used to surface
        # only at the end of a release, after the image and the GitHub release were
        # live, which forced a new tag each time (0.0.7 through 0.0.9). The image is
        # built right here, so assert it here.
        run: node scripts/check-image.mjs anteater-mcp:ci
      - name: Exercise image
        shell: bash
        run: |
          set -euo pipefail
          token=ci-test-token-0123456789
          cid=$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -e ANTEATER_MCP_TOKEN="${token}" -p 127.0.0.1:18787:8787 anteater-mcp:ci)
          cleanup() { docker rm -f "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18787/health >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18787/health | grep -q '"ok":true'

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' \
            http://127.0.0.1:18787/mcp)
          test "${status}" = 401

          curl -fsS -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' \
            http://127.0.0.1:18787/mcp | grep -q '"result"'

          curl -fsS -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"ping"}' \
            "http://127.0.0.1:18787/mcp?token=${token}" | grep -q '"result"'

          old_path_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"ping"}' \
            "http://127.0.0.1:18787/${token}/mcp")
          test "${old_path_status}" = 401

          duplicate_query_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":4,"method":"ping"}' \
            "http://127.0.0.1:18787/mcp?token=${token}&token=${token}")
          test "${duplicate_query_status}" = 401

          logs=$(docker logs "${cid}" 2>&1)
          grep -q '"event":"http.request"' <<<"${logs}"
          grep -q '"event":"http.response"' <<<"${logs}"
          grep -q 'token=\[REDACTED\]' <<<"${logs}"
          if grep -Fq "${token}" <<<"${logs}"; then
            echo "MCP token leaked into container logs" >&2
            exit 1
          fi

          test "$(docker inspect -f '{{.Config.User}}' "${cid}")" = node
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "${cid}")" = true
