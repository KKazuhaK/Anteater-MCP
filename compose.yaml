name: anteater-mcp

services:
  server:
    image: ghcr.io/kkazuhak/anteater-mcp:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    # Port exposure: choose ONE of the following.
    # Default (recommended): loopback only; put nginx/Caddy/aaPanel HTTPS in front.
    ports:
      - "127.0.0.1:8787:8787"
    # Public direct access: comment the line above and uncomment this line.
    # Use HTTPS in front whenever possible; the MCP token is still required.
    # - "8787:8787"
    environment:
      ANTEATER_MCP_TOKEN: "${ANTEATER_MCP_TOKEN:?set ANTEATER_MCP_TOKEN in .env}"
      ANTEATER_API_KEY: "${ANTEATER_API_KEY:-}"
      ANTEATER_API_BASE: "https://anteaterapi.com"
      ANTEATER_ALLOWED_ORIGINS: ""
      # Which peers may set X-Forwarded-*. Without this the server ignores them, so a
      # container behind a reverse proxy logs the bridge gateway and reports http://
      # in the generated OpenAPI document. "private" covers the Docker bridge.
      ANTEATER_TRUSTED_PROXIES: "${ANTEATER_TRUSTED_PROXIES:-private}"
      # Independent fallback for live schedule queries. Set to "off" to disable it.
      ZOTCOURSE_API_BASE: "${ZOTCOURSE_API_BASE:-https://zotcourse.appspot.com}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
